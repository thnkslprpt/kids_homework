<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#146c94">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Homework">
    <title>Homework</title>
    <link rel="stylesheet" href="app/style.css">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="app/icons/homework-icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="app/icons/apple-touch-icon.png">
  </head>
  <body>
    <main class="app-shell">
      <section id="start-screen" class="card screen">
        <h2>Start A Homework Session</h2>
        <div class="student-section">
          <p class="student-heading">Choose Student</p>
          <div id="user-selector" class="user-selector" role="group" aria-label="Student"></div>
        </div>
        <form id="start-form" class="start-form">
          <input id="hebrew-only" name="hebrewOnly" type="hidden" value="false">
          <input id="specialty-words-only" name="specialtyWordsOnly" type="hidden" value="false">

          <div class="start-fields">
            <label class="field question-count-field">
              <span>How many questions?</span>
              <input id="question-count" name="questionCount" type="hidden" value="30">
              <div class="question-count-selector" role="group" aria-label="Question count">
                <button type="button" class="question-count-button" data-question-count="20" aria-pressed="false">20</button>
                <button type="button" class="question-count-button active" data-question-count="30" aria-pressed="true">30</button>
                <button type="button" class="question-count-button" data-question-count="40" aria-pressed="false">40</button>
              </div>
            </label>

            <label class="field difficulty-field">
              <span id="difficulty-label">Difficulty</span>
              <div id="difficulty-selector" class="difficulty-selector" role="group" aria-labelledby="difficulty-label">
                <span class="difficulty-scale-label" aria-hidden="true">1</span>
                <input
                  id="difficulty-level"
                  name="difficultyLevel"
                  class="difficulty-slider"
                  type="range"
                  min="1"
                  max="10"
                  step="1"
                  value="3"
                  aria-labelledby="difficulty-label"
                >
                <span class="difficulty-scale-label" aria-hidden="true">10</span>
                <output id="difficulty-value" class="difficulty-value" for="difficulty-level">3</output>
              </div>
            </label>
          </div>

          <div id="session-builder" class="session-builder">
            <div class="builder-row builder-presets" aria-label="Session preset">
              <button type="button" class="builder-preset-button active" data-session-preset="adaptive" aria-pressed="true">Adaptive</button>
              <button type="button" class="builder-preset-button" data-session-preset="math-heavy" aria-pressed="false">Math</button>
              <button id="hebrew-only-button" type="button" class="builder-preset-button" data-session-preset="hebrew" aria-pressed="false">Hebrew</button>
            </div>
          </div>

          <button type="submit" class="primary-button">Start Homework</button>
        </form>
        <div class="start-actions">
          <button id="history-button" type="button" class="secondary-button history-button">Previous Sessions</button>
          <button id="dashboard-button" type="button" class="secondary-button history-button">Parent Dashboard</button>
        </div>
        <p id="start-feedback" class="feedback" aria-live="polite"></p>
      </section>

      <section id="quiz-screen" class="card screen" hidden>
        <div class="status-bar">
          <div class="status-card progress-card">
            <div id="progress-tracker" class="progress-tracker" aria-hidden="true"></div>
          </div>
          <div class="status-card score-card">
            <p id="score-text" class="status-value">0/0</p>
          </div>
        </div>
        <div id="speed-timer" class="speed-timer" aria-live="off" hidden>
          <div class="speed-timer-meta">
            <span>Speed Round</span>
            <strong id="speed-timer-text">10</strong>
          </div>
          <div class="speed-timer-track" aria-hidden="true">
            <span id="speed-timer-fill" class="speed-timer-fill"></span>
          </div>
        </div>

        <p id="feedback" class="feedback-banner" aria-live="polite"></p>

        <div class="question-panel">
          <p id="question-number" class="question-number">Question 1:</p>
          <p id="question-prompt" class="question-prompt"></p>
          <div id="question-main" class="question-main"></div>
          <div id="question-visual" class="question-visual" hidden></div>
          <div id="question-extra" class="question-extra"></div>
        </div>

        <form id="answer-form" class="answer-form" autocomplete="off" novalidate>
          <div id="input-area" class="answer-area">
            <input
              id="answer-input"
              name="homeworkAnswer"
              type="text"
              inputmode="decimal"
              enterkeyhint="done"
              autocomplete="off"
              autocorrect="off"
              autocapitalize="off"
              spellcheck="false"
              aria-label="Answer"
            >
            <button
              id="answer-sign-button"
              type="button"
              class="answer-sign-button"
              aria-label="Toggle negative sign"
              title="Toggle negative sign"
            >
              −
            </button>
            <button id="answer-submit-button" type="submit" class="primary-button answer-submit-button">
              Submit
            </button>
          </div>
        </form>

        <div id="choices-area" class="choices-area" hidden></div>
        <div id="drag-area" class="drag-area" hidden></div>
        <div class="quiz-nav" aria-label="Question navigation">
          <button id="quiz-back-button" type="button" class="secondary-button">Back</button>
          <button id="quiz-forward-button" type="button" class="secondary-button">Forward</button>
        </div>
      </section>

      <section id="results-screen" class="card screen" hidden>
        <h2 id="results-title">Session Finished</h2>
        <p id="results-summary" class="results-summary"></p>
        <div id="results-category-summary" class="results-category-summary" hidden></div>
        <div id="results-review-list" class="results-review-list" hidden></div>
        <div class="quiz-nav results-nav" aria-label="Session review navigation">
          <button id="results-back-button" type="button" class="secondary-button">Back</button>
          <button id="results-forward-button" type="button" class="secondary-button">Forward</button>
        </div>
        <button id="restart-button" type="button" class="secondary-button">Start Another Session</button>
      </section>

      <section id="history-screen" class="card screen" hidden>
        <div class="history-header">
          <h2>Previous Sessions</h2>
          <button id="history-back-button" type="button" class="secondary-button">Back</button>
        </div>
        <p id="history-empty" class="history-empty" hidden>No previous sessions yet.</p>
        <div id="history-list" class="history-list"></div>
      </section>

      <section id="dashboard-screen" class="card screen" hidden>
        <div class="history-header">
          <h2>Parent Dashboard</h2>
          <div class="dashboard-header-actions">
            <button id="dashboard-export-csv-button" type="button" class="secondary-button">Export CSV</button>
            <button id="dashboard-share-csv-button" type="button" class="secondary-button">Share CSV</button>
            <button id="dashboard-back-button" type="button" class="secondary-button">Back</button>
          </div>
        </div>
        <div id="dashboard-user-selector" class="dashboard-user-selector" role="group" aria-label="Dashboard student"></div>
        <div id="dashboard-content" class="dashboard-content"></div>
      </section>
    </main>

    <div id="app-update-banner" class="app-update-banner" hidden>
      <span>A new homework version is ready.</span>
      <button id="app-update-button" type="button">Reload</button>
    </div>

    <script src="app/question-utils.js"></script>
    <script src="app/questions/registry.js"></script>
    <script src="app/questions/manifest.js"></script>
    <script src="app/questions/load.js" data-base="app/"></script>
    <script src="app/core/namespace.js"></script>
    <script src="app/core/bootstrap-errors.js"></script>
    <script src="app/core/config.js"></script>
    <script src="app/core/state.js"></script>
    <script src="app/core/dom.js"></script>
    <script src="app/core/scoring.js"></script>
    <script src="app/core/session-history.js"></script>
    <script src="app/pwa/updates.js"></script>
    <script src="app/app.js"></script>
  </body>
</html>
