<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Homework</title>
    <link rel="stylesheet" href="app/style.css">
  </head>
  <body>
    <main class="app-shell">
      <section class="hero card">
        <h1>Homework</h1>
      </section>

      <section id="start-screen" class="card screen">
        <h2>Start A Homework Session</h2>
        <form id="start-form" class="start-form">
          <div class="start-fields">
            <label class="field question-count-field">
              <span>How many questions?</span>
              <input
                id="question-count"
                class="question-count-input"
                name="questionCount"
                type="number"
                min="1"
                max="150"
                value="30"
                required
              >
            </label>

            <label class="field difficulty-field">
              <span>Difficulty</span>
              <input id="difficulty-level" name="difficultyLevel" type="hidden" value="3">
              <div class="difficulty-selector" role="group" aria-label="Difficulty">
                <button type="button" class="difficulty-button level-1" data-difficulty="1" aria-pressed="false">1</button>
                <button type="button" class="difficulty-button level-2" data-difficulty="2" aria-pressed="false">2</button>
                <button type="button" class="difficulty-button level-3" data-difficulty="3" aria-pressed="true">3</button>
                <button type="button" class="difficulty-button level-4" data-difficulty="4" aria-pressed="false">4</button>
                <button type="button" class="difficulty-button level-5" data-difficulty="5" aria-pressed="false">5</button>
              </div>
            </label>
          </div>

          <button type="submit" class="primary-button">Start Homework</button>
        </form>
        <button id="history-button" type="button" class="secondary-button history-button">Previous Sessions</button>
        <p id="start-feedback" class="feedback" aria-live="polite"></p>
      </section>

      <section id="quiz-screen" class="card screen" hidden>
        <div class="status-bar">
          <div class="status-card progress-card">
            <div id="progress-tracker" class="progress-tracker" aria-hidden="true"></div>
          </div>
          <div class="status-card score-card">
            <p id="score-text" class="status-value">0/0</p>
          </div>
        </div>

        <p id="feedback" class="feedback-banner" aria-live="polite"></p>

        <div class="question-panel">
          <p id="question-number" class="question-number">Question 1:</p>
          <p id="question-prompt" class="question-prompt"></p>
          <div id="question-main" class="question-main"></div>
          <div id="question-visual" class="question-visual" hidden></div>
          <div id="question-extra" class="question-extra"></div>
        </div>

        <form id="answer-form" class="answer-form">
          <div id="input-area" class="answer-area">
            <input
              id="answer-input"
              name="answer"
              type="number"
              inputmode="numeric"
              step="any"
              autocomplete="off"
              aria-label="Answer"
            >
          </div>
        </form>

        <div id="choices-area" class="choices-area" hidden></div>
      </section>

      <section id="results-screen" class="card screen" hidden>
        <h2 id="results-title">Session Finished</h2>
        <p id="results-summary" class="results-summary"></p>
        <button id="restart-button" type="button" class="secondary-button">Start Another Session</button>
      </section>

      <section id="history-screen" class="card screen" hidden>
        <div class="history-header">
          <h2>Previous Sessions</h2>
          <button id="history-back-button" type="button" class="secondary-button">Back</button>
        </div>
        <p id="history-empty" class="history-empty" hidden>No previous sessions yet.</p>
        <div id="history-list" class="history-list"></div>
      </section>
    </main>

    <script src="app/hebrew-words.js"></script>
    <script src="app/science-questions.js"></script>
    <script src="app/general-knowledge-questions.js"></script>
    <script src="app/algebra-questions.js"></script>
    <script src="app/visual-math-questions.js"></script>
    <script src="app/logic-questions.js"></script>
    <script src="app/rationality-questions.js"></script>
    <script src="app/geography-questions.js"></script>
    <script src="app/population-questions.js"></script>
    <script src="app/financial-literacy-questions.js"></script>
    <script src="app/measurement-questions.js"></script>
    <script src="app/charts-and-graphs-questions.js"></script>
    <script src="app/calendar-questions.js"></script>
    <script src="app/estimation-questions.js"></script>
    <script src="app/probability-questions.js"></script>
    <script src="app/maps-and-directions-questions.js"></script>
    <script src="app/digital-safety-questions.js"></script>
    <script src="app/health-and-first-aid-questions.js"></script>
    <script src="app/nutrition-questions.js"></script>
    <script src="app/household-problem-solving-questions.js"></script>
    <script src="app/fractions-questions.js"></script>
    <script src="app/fractions-and-ratios-questions.js"></script>
    <script src="app/spatial-reasoning-questions.js"></script>
    <script src="app/app.js"></script>
  </body>
</html>
