<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Geography Map Gallery</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6efe2;
        --card: #ffffff;
        --ink: #22314a;
        --muted: #5f6f84;
        --line: rgba(34, 49, 74, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: radial-gradient(circle at top, #fffaf0, var(--bg));
        color: var(--ink);
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      main {
        max-width: 1360px;
        margin: 0 auto;
        padding: 32px 20px 48px;
      }

      h1 {
        margin: 0 0 10px;
        font-size: clamp(1.9rem, 3vw, 2.5rem);
      }

      .intro {
        margin: 0 0 28px;
        max-width: 860px;
        color: var(--muted);
        line-height: 1.6;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
        gap: 18px;
      }

      .card {
        border: 1px solid var(--line);
        border-radius: 22px;
        background: rgba(255, 255, 255, 0.9);
        padding: 18px;
        box-shadow: 0 16px 40px rgba(34, 49, 74, 0.08);
      }

      .card h2 {
        margin: 8px 0 6px;
        font-size: 1.2rem;
      }

      .rank {
        display: inline-block;
        padding: 4px 10px;
        border-radius: 999px;
        background: #e9f1fb;
        color: #24507a;
        font-size: 0.85rem;
        font-weight: 700;
      }

      .meta {
        margin: 10px 0 0;
        color: var(--muted);
        font-size: 0.95rem;
      }

      .card .visual-card {
        margin-top: 14px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Geography Map Gallery</h1>
      <p class="intro">Shared-base geography map rendering for the top 101 countries by population, frozen to the 2026-04-13 snapshot.</p>
      <section class="grid" id="gallery"></section>
    </main>
    <script src="../questions/geography/geography-map-data.js"></script>
    <script src="../questions/geography/geography-map.js"></script>
    <script>
      const gallery = document.getElementById("gallery");
      const entries = Array.isArray(window.GEOGRAPHY_MAP_COUNTRIES) ? window.GEOGRAPHY_MAP_COUNTRIES : [];
      const renderVisual = typeof window.renderGeographyMapVisualHtml === "function"
        ? window.renderGeographyMapVisualHtml
        : () => "<p>Renderer unavailable.</p>";

      entries.forEach((entry) => {
        const card = document.createElement("article");
        card.className = "card";
        card.innerHTML = `
          <div class="rank">#${entry.rank}</div>
          <h2></h2>
          ${renderVisual(entry)}
          <p class="meta"></p>
        `;
        card.querySelector("h2").textContent = entry.country;
        card.querySelector(".meta").textContent = `${entry.continent} · ${entry.choiceGroup} · level ${entry.minDifficulty}+`;
        gallery.appendChild(card);
      });
    </script>
  </body>
</html>
